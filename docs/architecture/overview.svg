<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Figtree, system-ui, sans-serif">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;display=swap');
    .box { fill: #13202d; stroke: #33495f; stroke-width: 1.5; }
    .actor { fill: #182736; stroke: #8ea6ec; stroke-width: 1.5; }
    .title { fill: #eef2f6; font-size: 24px; font-weight: 600; }
    .sub { fill: #93a2b3; font-size: 17px; }
    .line { stroke: #5d7390; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 7 7; }
    .tag { fill: #c3cdd8; font-size: 15px; }
    .num { fill: #8ea6ec; }
    .numt { fill: #0b1830; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .step { fill: #eef2f6; font-size: 19px; font-weight: 600; }
    .stepd { fill: #93a2b3; font-size: 16px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5d7390"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0a141e"/>

  <text x="60" y="88" fill="#eef2f6" font-size="40" font-weight="600" letter-spacing="-0.8">GrowthReceipt architecture</text>
  <text x="60" y="126" class="sub" font-size="20">A marketing agent that learns from verified PayPal payments, not likes.</text>

  <!-- Connections -->
  <path class="line" d="M300 290 C 400 290, 390 500, 466 500"/>
  <path class="line" d="M300 740 C 400 740, 390 560, 466 560"/>
  <path class="line" d="M684 520 L 756 520" marker-start="url(#arrow)"/>
  <path class="line" d="M890 456 C 890 300, 1000 285, 1076 285" marker-start="url(#arrow)"/>
  <path class="line" d="M960 584 C 960 690, 1000 740, 1076 740" marker-start="url(#arrow)"/>
  <path class="line" d="M830 584 L 830 796"/>
  <path class="line dash" d="M560 584 C 560 850, 650 860, 756 860"/>
  <path class="line" d="M180 820 L 180 985 L 1200 985 L 1200 809"/>

  <!-- Line labels -->
  <g><circle class="num" cx="322" cy="255" r="14"/><text class="numt" x="322" y="260">1</text>
     <circle class="num" cx="354" cy="255" r="14"/><text class="numt" x="354" y="260">3</text>
     <text class="tag" x="378" y="261">brief, approval</text></g>
  <g><circle class="num" cx="74" cy="672" r="14"/><text class="numt" x="74" y="677">4</text>
     <text class="tag" x="98" y="678">opens checkout</text></g>
  <text class="tag" x="694" y="505">HTTPS</text>
  <g><circle class="num" cx="927" cy="380" r="14"/><text class="numt" x="927" y="385">2</text>
     <circle class="num" cx="959" cy="380" r="14"/><text class="numt" x="959" y="385">8</text>
     <text class="tag" x="983" y="386">typed outputs</text></g>
  <g><circle class="num" cx="1012" cy="650" r="14"/><text class="numt" x="1012" y="655">5</text>
     <circle class="num" cx="1044" cy="650" r="14"/><text class="numt" x="1044" y="655">6</text>
     <text class="tag" x="1068" y="656">orders, capture, webhooks</text></g>
  <g><circle class="num" cx="830" cy="690" r="14"/><text class="numt" x="830" y="695">7</text>
     <text class="tag" x="808" y="740" text-anchor="end">attributed revenue</text></g>
  <text class="tag" x="548" y="770" text-anchor="end">sign in</text>
  <g><circle class="num" cx="600" cy="985" r="14"/><text class="numt" x="600" y="990">4</text>
     <text class="tag" x="624" y="970">pays in PayPal checkout</text></g>

  <!-- Actors -->
  <rect class="actor" x="60" y="230" width="240" height="120" rx="18"/>
  <text class="title" x="88" y="280">Founder</text>
  <text class="sub" x="88" y="312">Briefs and approves</text>

  <rect class="actor" x="60" y="700" width="240" height="120" rx="18"/>
  <text class="title" x="88" y="750">Buyer</text>
  <text class="sub" x="88" y="782">Clicks a post, pays</text>

  <!-- Services -->
  <rect class="box" x="470" y="460" width="210" height="120" rx="18"/>
  <text class="title" x="494" y="510">Web app</text>
  <text class="sub" x="494" y="542">Next.js on Railway</text>

  <rect class="box" x="760" y="460" width="260" height="120" rx="18" fill="#182736"/>
  <text class="title" x="786" y="510">GrowthReceipt API</text>
  <text class="sub" x="786" y="542">FastAPI on Railway</text>

  <rect class="box" x="1080" y="225" width="240" height="120" rx="18"/>
  <text class="title" x="1106" y="275">OpenAI agent</text>
  <text class="sub" x="1106" y="307">Drafts, next move</text>

  <rect class="box" x="1080" y="675" width="240" height="130" rx="18"/>
  <text class="title" x="1106" y="725">PayPal</text>
  <text class="sub" x="1106" y="757">Orders API, SDK v6</text>
  <text class="sub" x="1106" y="783">Verified webhooks</text>

  <rect class="box" x="760" y="800" width="260" height="120" rx="18"/>
  <text class="title" x="786" y="850">Supabase</text>
  <text class="sub" x="786" y="882">Postgres and Auth</text>

  <!-- Step panel -->
  <rect x="1360" y="190" width="500" height="830" rx="22" fill="#13202d" stroke="#24364a" stroke-width="1.5"/>
  <text x="1396" y="240" fill="#93a2b3" font-size="16" font-weight="600" letter-spacing="1.5">THE LOOP</text>

  <g transform="translate(1396 280)">
    <circle class="num" cx="14" cy="10" r="14"/><text class="numt" x="14" y="15">1</text>
    <text class="step" x="42" y="16">Brief</text><text class="stepd" x="42" y="42">Product, price, audience, channels</text>
  </g>
  <g transform="translate(1396 370)">
    <circle class="num" cx="14" cy="10" r="14"/><text class="numt" x="14" y="15">2</text>
    <text class="step" x="42" y="16">Agent drafts the campaign</text><text class="stepd" x="42" y="42">Typed posts, live progress streamed</text>
  </g>
  <g transform="translate(1396 460)">
    <circle class="num" cx="14" cy="10" r="14"/><text class="numt" x="14" y="15">3</text>
    <text class="step" x="42" y="16">Founder approves</text><text class="stepd" x="42" y="42">Nothing goes out without a human</text>
  </g>
  <g transform="translate(1396 550)">
    <circle class="num" cx="14" cy="10" r="14"/><text class="numt" x="14" y="15">4</text>
    <text class="step" x="42" y="16">Buyer checks out</text><text class="stepd" x="42" y="42">PayPal order tied to the campaign</text>
  </g>
  <g transform="translate(1396 640)">
    <circle class="num" cx="14" cy="10" r="14"/><text class="numt" x="14" y="15">5</text>
    <text class="step" x="42" y="16">Capture</text><text class="stepd" x="42" y="42">Idempotent, never counted twice</text>
  </g>
  <g transform="translate(1396 730)">
    <circle class="num" cx="14" cy="10" r="14"/><text class="numt" x="14" y="15">6</text>
    <text class="step" x="42" y="16">Webhook verified</text><text class="stepd" x="42" y="42">PayPal signature checked server side</text>
  </g>
  <g transform="translate(1396 820)">
    <circle class="num" cx="14" cy="10" r="14"/><text class="numt" x="14" y="15">7</text>
    <text class="step" x="42" y="16">Revenue attributed</text><text class="stepd" x="42" y="42">Stored against the campaign</text>
  </g>
  <g transform="translate(1396 910)">
    <circle class="num" cx="14" cy="10" r="14"/><text class="numt" x="14" y="15">8</text>
    <text class="step" x="42" y="16">Next move</text><text class="stepd" x="42" y="42">Agent learns from payment evidence</text>
  </g>

  <text x="60" y="1050" class="sub">The buyer pays the founder's PayPal merchant account. The hosted demo uses one PayPal sandbox merchant.</text>
</svg>
