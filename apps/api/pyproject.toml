[project]
name = "growthreceipt-api"
version = "0.1.0"
description = "API and agent orchestration for GrowthReceipt"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "cryptography>=50.0.2,<51",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.119,<1",
  "httpx>=0.28,<1",
  "openai>=3.13,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
