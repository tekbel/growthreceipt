# Daily check that the live demo still works.
# Runs the hosted browser tests without the PayPal purchase, so it costs nothing.
# It also audits dependencies, so an advisory published after the last push is caught.
# GitHub emails the owner when a scheduled run fails.
name: Smoke

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  hosted:
    name: Hosted judge demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The tests run against the live site, so only the test runner is installed.
      - run: npm install --no-save --no-package-lock @playwright/test@1.64.1
      - run: |
          curl -fsS https://growthreceipt.addisstack.com/version
          echo
          curl -fsS https://growthreceipt-api.addisstack.com/health/version
          echo
          curl -fsS https://growthreceipt-api.addisstack.com/health/ready
      - run: npx playwright test
        env:
          E2E_BASE_URL: https://growthreceipt.addisstack.com
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: /tmp/growthreceipt-playwright
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      # Only what ships is audited. Dev tools never reach production.
      - name: Audit API dependencies
        run: pip-audit apps/api
      - name: Audit web dependencies
        run: npm audit --omit=dev
