name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded pull request runs. A dev push must finish, or a
  # second push can cancel a promotion while it is merging.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web

  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e './apps/api[dev]'
      - run: ruff check apps/api scripts services
      - run: mypy apps/api services/worker
      - run: pytest -q apps/api

  container:
    name: Production image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: api
            context: apps/api
            file: apps/api/Dockerfile
          - service: web
            context: .
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # Railway builds these same Dockerfiles, so a broken image fails here
      # instead of after the promotion.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote:
    name: Promote dev to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - web
      - api
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Queue promotions instead of cancelling one that is already pushing.
    concurrency:
      group: promote-dev
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fast forward only. Railway deploys whatever lands on main, so main must
      # only ever hold commits that passed every check above. If main has a
      # commit dev lacks (a hotfix), this fails and dev needs that commit first.
      - name: Fast forward main to the tested commit
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "main already contains ${GITHUB_SHA}. Nothing to promote."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "${GITHUB_SHA}"; then
            echo "::error::main has commits that dev does not. Merge main into dev, then push dev again."
            exit 1
          fi
          git push origin "${GITHUB_SHA}:refs/heads/main"
